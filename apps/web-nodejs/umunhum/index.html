<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Favicons -->
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />

        <!-- Apple Touch Icon -->
        <link rel="apple-touch-icon" href="/icon-180.png" />

        <!-- Android/Chrome -->
        <link
            rel="icon"
            type="image/png"
            sizes="192x192"
            href="/icon-192.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="512x512"
            href="/icon-512.png"
        />

        <!-- Web App Manifest -->
        <link rel="manifest" href="/manifest.json" />

        <!-- Meta tags -->
        <meta
            name="description"
            content="Upload an image to find similar images using AI-powered visual search"
        />
        <meta name="theme-color" content="#29d5e9" />

        <!-- Open Graph / Social sharing -->
        <meta property="og:title" content="Umunhum" />
        <meta
            property="og:description"
            content="AI-powered visual image similarity search"
        />
        <meta property="og:image" content="/icon-512.png" />
        <meta property="og:type" content="website" />

        <title>Umunhum - Image Search</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
