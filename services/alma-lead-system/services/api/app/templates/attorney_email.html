<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: 0 auto;">
  <h2 style="color: #1a365d;">New Lead Submitted</h2>
  <table style="border-collapse: collapse; width: 100%;">
    <tr>
      <td style="padding: 8px; font-weight: bold; border-bottom: 1px solid #eee;">Name</td>
      <td style="padding: 8px; border-bottom: 1px solid #eee;">{{ first_name }} {{ last_name }}</td>
    </tr>
    <tr>
      <td style="padding: 8px; font-weight: bold; border-bottom: 1px solid #eee;">Email</td>
      <td style="padding: 8px; border-bottom: 1px solid #eee;">{{ email }}</td>
    </tr>
  </table>
  <p style="margin-top: 16px;">Please review this lead in the <a href="http://alma-internal.thirdwavesoft.com/leads">internal portal</a>.</p>
  <br>
  <p>– Alma System</p>
</body>
</html>
