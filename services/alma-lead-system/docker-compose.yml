version: "3.9"

services:
  # ── PostgreSQL ──
  # Disabled: using host-installed PostgreSQL on localhost:5432
  # To use Docker postgres instead, uncomment below and update DATABASE_URL in .env
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB:-alma_db}
  #     POSTGRES_USER: ${POSTGRES_USER:-alma_user}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alma_passwd}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #     - ./database/ddl.sql:/docker-entrypoint-initdb.d/01-ddl.sql
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alma_user} -d ${POSTGRES_DB:-alma_db}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-4002}:4002"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-alma_user}:${POSTGRES_PASSWORD:-alma_passwd}@host.docker.internal:5432/${POSTGRES_DB:-alma_db}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://alma-lead.thirdwavesoft.com,http://alma-internal.thirdwavesoft.com}
      API_KEY: ${API_KEY:-3kxgnRlA8v4Ql2IodaitnuN1YSwLCEks}
    volumes:
      - ./services/api:/app
      - upload_data:${UPLOAD_DIR:-/mnt/data/alma}
    depends_on:
      redis:
        condition: service_healthy

  # ── Lead Portal (Public) ──
  lead-portal:
    build:
      context: ./apps/lead-portal
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${LEAD_API_URL:-http://alma-api.thirdwavesoft.com}
    ports:
      - "${LEAD_PORTAL_PORT:-4000}:3000"
    depends_on:
      - api

  # ── Internal Portal ──
  internal-portal:
    build:
      context: ./apps/internal-portal
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${INTERNAL_API_URL:-http://alma-api.thirdwavesoft.com}
    ports:
      - "${INTERNAL_PORTAL_PORT:-4001}:3000"
    depends_on:
      - api

volumes:
  # pgdata:  # uncomment if using Docker postgres
  redisdata:
  upload_data:
